name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Guard — no credentials in published files
        run: |
          test ! -d public/admin || { echo "public/admin/ folder must not be published"; exit 1; }
          test ! -d public/views || { echo "public/views/ folder must not be published"; exit 1; }
          # The dashboard password must never appear in the client bundle.
          ! grep -rqE "Saytar123" public || { echo "Dashboard password found in public/"; exit 1; }
          # No GitHub tokens of any kind may be embedded.
          ! grep -rqE "github_pat_[A-Za-z0-9_]{10,}|ghp_[A-Za-z0-9]{10,}|gho_[A-Za-z0-9]{10,}|RELEASES_TOKEN" public || { echo "Token or token reference found in public/"; exit 1; }

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
