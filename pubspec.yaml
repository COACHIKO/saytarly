name: saytarly
description: >-
  Saytarly — the all-in-one cafe management suite: theming (Theme/Accent
  cubits), ARB localization, DI, routing, networking, storage and the custom
  widget/desktop kit. Feature apps plug in their screens under lib/Features
  and register their bootstrap here.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core state management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  get_it: ^8.3.0

  # Networking
  connectivity_plus: ^6.1.5
  dio: ^5.11.0
  http: ^1.2.0

  # UI Components
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.16
  fluttertoast: ^8.2.8
  pinput: ^5.0.0

  # Localization
  intl: ^0.20.1

  # Storage & Databases
  shared_preferences: ^2.5.2
  path_provider: ^2.1.6
  path: ^1.9.0
  sqflite: 2.4.1
  sqflite_common_ffi: ^2.3.0+4

  # Web server / QR menu
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  supabase_flutter: ^2.5.0

  # Documents & printing
  pdf: ^3.11.1
  printing: ^5.13.4
  image: ^4.2.0
  google_fonts: ^6.2.1
  arabic_reshaper: ^0.0.1

  # QR Code
  qr_flutter: ^4.1.0

  # Crypto / licensing
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Desktop & device identity
  win32: ^5.5.0
  ffi: ^2.1.0
  android_id: ^0.4.0
  device_info_plus: ^11.2.0

  # Windows window + system tray
  window_manager: ^0.5.2
  tray_manager: ^0.5.3

  # Utilities
  file_picker: ^10.3.10
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  sqlite3_flutter_libs: 0.5.39

dev_dependencies:
  build_runner: ^2.4.14
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0
  pretty_dio_logger: ^1.4.0

dependency_overrides:
  intl: ^0.20.1

# For information about the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Ensures the Material Icons font is included with the application.
  uses-material-design: true
  # gen-l10n is not used; the template's hand-rolled l10n runtime compiles
  # lib/l10n/*.arb into lib/core/localization/generated/app_messages.dart
  # via `dart run tool/l10n_extract.dart`.

  # App assets. Feature apps add their own folders here.
  assets:
    - assets/images/
    - assets/logo2/
    - assets/fonts/

  #----------------- LOCAL FONTS -----------------#
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
