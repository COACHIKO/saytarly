# Render Blueprint — deploy the Saytarly website.
# After pushing, go to https://render.com > New > Blueprint,
# connect this GitHub repo and apply. Then set the RELEASES_TOKEN
# secret in the service's Environment settings.

services:
  - type: web
    name: saytarly-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RELEASES_REPO
        value: COACHIKO/saytarly_releases
      - key: RELEASES_TOKEN
        sync: false # set this secret manually in the Render dashboard
