<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="auth.pageTitle">دخول لوحة الأجهزة — Saytarly</title>
  <meta name="robots" content="noindex" />
  <script src="/js/lang-boot.js"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/logoSVG.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(720px 420px at 15% -10%, rgba(22, 119, 255, 0.18), transparent 65%),
        radial-gradient(620px 420px at 105% 110%, rgba(22, 119, 255, 0.1), transparent 60%),
        var(--navy-900);
    }
    .lang-float { position: fixed; top: 20px; inset-inline-end: 20px; }
    .login-wrap { width: min(440px, 100%); }
    .login-brand { display: flex; justify-content: center; margin-bottom: 26px; }
    .login-brand .brand { gap: 12px; }
    .login-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-lg);
      padding: 34px 30px 30px;
      box-shadow: var(--shadow-float);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: var(--grad-brand);
    }
    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      background: rgba(22, 119, 255, 0.12);
      border: 1px solid rgba(22, 119, 255, 0.3);
      color: var(--accent-soft);
      font-size: 11.5px;
      font-weight: 700;
    }
    .login-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }
    .login-card h1 { font-size: 26px; font-weight: 900; margin-top: 14px; }
    .login-card .sub { color: var(--text-2); font-size: 13.5px; margin-top: 6px; line-height: 1.7; }
    .field { display: grid; gap: 6px; margin-top: 18px; }
    .field label { color: var(--text-2); font-size: 12.5px; font-weight: 700; }
    .field input {
      width: 100%;
      background: var(--sunken);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-1);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.16); }
    .login-submit {
      width: 100%;
      justify-content: center;
      margin-top: 22px;
      padding: 13px 24px;
    }
    .login-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .login-actions a { color: var(--accent-soft); font-size: 12.5px; font-weight: 700; }
    .login-actions a:hover { text-decoration: underline; }
    .login-note { color: var(--text-3); font-size: 11px; line-height: 1.6; }
    .login-error {
      margin-top: 16px;
      padding: 11px 14px;
      border-radius: 11px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.38);
      color: #fecaca;
      font-size: 12.5px;
      font-weight: 700;
    }
    .login-error[hidden] { display: none; }
    @media (max-width: 480px) {
      .login-card { padding: 28px 22px 24px; }
      .lang-float { top: 14px; inset-inline-end: 14px; }
    }
  </style>
</head>
<body>
  <button class="lang-switch lang-float" type="button" data-lang-switch aria-label="تغيير اللغة">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"/></svg>
    <span data-lang-label>EN</span>
  </button>

  <div class="login-wrap">
    <div class="login-brand">
      <a href="/" class="brand">
        <span class="logo-tile" style="width:38px;height:38px;border-radius:12px">
          <svg viewBox="0 0 1440 1196" fill="#fff" aria-hidden="true"><path d="M 442,0 L 1386,0 L 1386,4 L 1248,210 L 1226,233 L 1213,243 L 1176,262 L 1151,268 L 1129,270 L 441,270 L 408,274 L 380,282 L 351,295 L 326,311 L 299,337 L 276,371 L 262,405 L 255,444 L 255,471 L 258,492 L 263,514 L 272,538 L 294,575 L 326,609 L 350,626 L 374,639 L 399,648 L 429,654 L 801,655 L 804,657 L 806,685 L 812,707 L 822,729 L 837,751 L 852,767 L 876,785 L 893,794 L 921,803 L 921,805 L 342,804 L 303,800 L 273,794 L 250,788 L 212,774 L 168,751 L 139,731 L 115,711 L 82,676 L 63,651 L 40,613 L 25,579 L 16,552 L 5,506 L 1,476 L 0,427 L 2,403 L 8,367 L 17,331 L 33,286 L 54,242 L 70,215 L 94,181 L 111,160 L 144,126 L 173,101 L 217,70 L 244,54 L 283,35 L 327,19 L 361,10 L 403,3 Z M 445,454 L 1126,454 L 1162,458 L 1202,467 L 1239,480 L 1275,497 L 1326,531 L 1376,580 L 1407,624 L 1420,650 L 1431,682 L 1440,751 L 1440,804 L 1438,825 L 1422,901 L 1410,935 L 1392,973 L 1365,1016 L 1334,1053 L 1297,1089 L 1260,1118 L 1211,1148 L 1165,1169 L 1121,1183 L 1072,1193 L 1032,1196 L 22,1195 L 22,1192 L 39,1166 L 73,1118 L 126,1036 L 162,986 L 175,973 L 197,957 L 236,940 L 274,934 L 1065,934 L 1104,927 L 1139,912 L 1154,902 L 1176,880 L 1189,862 L 1201,835 L 1206,810 L 1205,773 L 1201,755 L 1194,737 L 1178,711 L 1157,690 L 1138,677 L 1099,661 L 1098,634 L 1095,617 L 1080,579 L 1065,557 L 1048,540 L 1026,524 L 993,510 L 968,505 L 935,505 L 911,510 L 880,523 L 858,538 L 841,555 L 827,574 L 445,574 L 427,569 L 416,562 L 403,547 L 395,525 L 395,503 L 400,487 L 407,476 L 424,461 Z M 937,546 L 967,546 L 982,549 L 1004,558 L 1019,568 L 1033,582 L 1046,601 L 1058,637 L 1059,662 L 1056,680 L 1050,698 L 1039,718 L 1027,732 L 1011,745 L 989,756 L 969,761 L 945,762 L 926,759 L 911,754 L 892,744 L 884,738 L 864,716 L 853,695 L 846,669 L 845,651 L 849,624 L 853,612 L 867,587 L 880,573 L 899,559 L 914,552 Z" fill-rule="evenodd" clip-rule="evenodd"/></svg>
          <span class="sheen"></span>
        </span>
        <span class="word">SAYTARLY<small>RESTAURANT &amp; CAFÉ</small></span>
      </a>
    </div>

    <section class="login-card">
      <span class="login-badge"><span class="dot"></span> <span data-i18n="auth.badge">دخول محمي</span></span>
      <h1 data-i18n="auth.title">لوحة الأجهزة</h1>
      <p class="sub" data-i18n="auth.subtitle">ادخل بياناتك للوصول للوحة إدارة الأجهزة والتراخيص.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username" data-i18n="auth.username">اسم المستخدم</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required data-i18n-placeholder="auth.usernamePlaceholder" placeholder="اسم المستخدم" />
        </div>
        <div class="field">
          <label for="password" data-i18n="auth.password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required data-i18n-placeholder="auth.passwordPlaceholder" placeholder="كلمة المرور" />
        </div>

        <div class="login-error" id="loginError" hidden></div>

        <button class="btn btn-primary login-submit" type="submit" id="loginBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>
          <span id="loginBtnLabel" data-i18n="auth.submit">دخول</span>
        </button>
      </form>

      <div class="login-actions">
        <a href="/" data-i18n="auth.back">الرجوع للرئيسية</a>
        <span class="login-note" data-i18n="auth.secureNote">الوصول محمي على السيرفر — بيانات الدخول مش موجودة في الصفحة.</span>
      </div>
    </section>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    (function () {
      'use strict';
      var i18n = window.SaytarlyI18n;
      var t = i18n.t;
      var form = document.getElementById('loginForm');
      var username = document.getElementById('username');
      var password = document.getElementById('password');
      var loginBtn = document.getElementById('loginBtn');
      var loginBtnLabel = document.getElementById('loginBtnLabel');
      var errorEl = document.getElementById('loginError');
      var errorKey = '';

      function showError(key) {
        errorKey = key;
        errorEl.textContent = t(key);
        errorEl.hidden = false;
      }

      function hideError() {
        errorKey = '';
        errorEl.hidden = true;
      }

      document.addEventListener('saytarly:langchange', function () {
        if (!loginBtn.disabled) loginBtnLabel.textContent = t('auth.submit');
        if (errorKey) errorEl.textContent = t(errorKey);
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        hideError();

        if (!username.value.trim() || !password.value) {
          showError('auth.invalid');
          return;
        }

        loginBtn.disabled = true;
        loginBtnLabel.textContent = t('auth.submitting');

        try {
          var res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              username: username.value.trim(),
              password: password.value,
            }),
          });
          var data = null;
          try { data = await res.json(); } catch (e) { /* ignore */ }

          if (res.ok) {
            window.location.replace('/dashboard');
            return;
          }
          if (res.status === 429) {
            showError('auth.rateLimited');
          } else if (res.status === 401) {
            showError('auth.invalid');
          } else {
            showError('auth.error');
          }
        } catch (e) {
          showError('auth.error');
        } finally {
          loginBtn.disabled = false;
          loginBtnLabel.textContent = t('auth.submit');
        }
      });

      username.focus();
    })();
  </script>
</body>
</html>
